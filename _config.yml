# ==========================================================================
#  Site configuration — alessandrociardo.github.io
#  Based on the Academic Pages template (Jekyll / Minimal Mistakes).
#  Note: this file is NOT reloaded automatically by `jekyll serve`.
#        Restart the server after editing it.
# ==========================================================================

# --- Basic site settings ---------------------------------------------------
locale                   : "en-US"
site_theme               : "ciardo"
title                    : "Alessandro Ciardo"
title_separator          : "|"
name                     : &name "Alessandro Ciardo"
description              : &description "PhD candidate in Economics at the University of Barcelona and the Barcelona Institute of Economics (IEB). Urban, housing and political economics."
url                      : https://alessandrociardo.github.io
baseurl                  : ""
repository               : "alessandrociardo/alessandrociardo.github.io"

# --- Job market ------------------------------------------------------------
# Set `on_the_market` to false after the job market season to hide the banner
# on the front page. Nothing else needs to change.
on_the_market            : true
job_market_year          : "2026/27"

# --- Sidebar author profile ------------------------------------------------
#     A blank field hides its icon and link.
author:
  avatar           : "profile.jpg"
  name             : "Alessandro Ciardo"
  pronouns         :
  bio              : "PhD candidate in Economics. Urban, housing and political economics."
  location         : "Barcelona, Spain"
  employer         : "University of Barcelona & IEB"
  uri              :
  email            : "alessandro.ciardo@ub.edu"

  # Academic profiles
  academia         :
  arxiv            :
  googlescholar    :
  inspire-hep      :
  impactstory      :
  orcid            :
  semantic         :
  ssrn             :
  pubmed           :
  researchgate     :
  scopus           :
  zotero           :

  # Repositories and software development
  bitbucket        :
  codepen          :
  dribbble         :
  github           : "alessandrociardo"
  kaggle           :
  stackoverflow    :

  # Social media
  artstation       :
  bluesky          :
  facebook         :
  flickr           :
  foursquare       :
  goodreads        :
  google_plus      :
  keybase          :
  instagram        :
  lastfm           :
  linkedin         : "alessandro-ciardo-219502139"
  mastodon         :
  medium           :
  pinterest        :
  soundcloud       :
  steam            :
  telegram         :
  tumblr           :
  twitter          :
  vine             :
  weibo            :
  wikipedia        :
  xing             :
  youtube          :
  zhihu            :

# --- Research page sections ------------------------------------------------
#     Each key is a `category` value usable in the front matter of a file in
#     _publications/. Sections appear on /research/ in the order listed here,
#     and are skipped entirely when they contain no paper.
publication_category:
  jmp:
    title: 'Job Market Paper'
  articles:
    title: 'Publications'
  wp:
    title: 'Working Papers'
  wip:
    title: 'Work in Progress'

# --- Site settings ---------------------------------------------------------
teaser                   :
breadcrumbs              : false
words_per_minute         : 160
future                   : true
read_more                : "disabled"
talkmap_link             : false
comments:
  provider               : false
atom_feed:
  hide                   : true

# --- SEO -------------------------------------------------------------------
google_site_verification : "IIxKk87EwQPJsLD5euuGXWtE0QP6lDmlQrCtb2hhYbY"
bing_site_verification   :
alexa_site_verification  :
yandex_site_verification :

twitter:
  username               : &twitter
facebook:
  username               :
  app_id                 :
  publisher              :
og_image                 : "/images/profile.jpg"
og_description           : *description
social:
  type                   : Person
  name                   : *name
  links:

# --- Analytics -------------------------------------------------------------
analytics:
  provider               : "false"
  google:
    tracking_id          :

# --- Reading files ---------------------------------------------------------
include:
  - .htaccess
  - _pages
  - files
exclude:
  - "*.sublime-project"
  - "*.sublime-workspace"
  - .asset-cache
  - .bundle
  - .devcontainer
  - .github
  - .jekyll-assets-cache
  - .sass-cache
  - assets/js/_main.js
  - assets/js/plugins
  - assets/js/vendor
  - CHANGELOG
  - Capfile
  - config
  - Dockerfile
  - docker-compose.yaml
  - Gemfile
  - Gruntfile.js
  - gulpfile.js
  - LICENSE
  - local
  - log
  - node_modules
  - package.json*
  - Rakefile
  - README
  - tmp
  - vendor
keep_files:
  - .git
  - .svn
encoding: "utf-8"
markdown_ext: "markdown,mkdown,mkdn,mkd,md"

# --- Conversion ------------------------------------------------------------
markdown: kramdown
highlighter: rouge
lsi: false
excerpt_separator: "\n\n"
incremental: false

kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
  footnote_nr: 1
  entity_output: as_char
  toc_levels: 1..6
  smart_quotes: lsquo,rsquo,ldquo,rdquo
  enable_coderay: false

# --- Collections -----------------------------------------------------------
collections:
  teaching:
    output: true
    permalink: /:collection/:path/
  publications:
    output: true
    permalink: /:collection/:path/

# --- Defaults --------------------------------------------------------------
defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: single
      author_profile: true
      read_time: false
      comments: false
      share: false
      related: false
  - scope:
      path: ""
      type: pages
    values:
      layout: single
      author_profile: true
  - scope:
      path: ""
      type: teaching
    values:
      layout: single
      author_profile: true
      share: false
      comments: false
  - scope:
      path: ""
      type: publications
    values:
      layout: single
      author_profile: true
      share: false
      comments: false

# --- Sass ------------------------------------------------------------------
sass:
  sass_dir: _sass
  style: compressed

# --- Outputting ------------------------------------------------------------
permalink: /:categories/:title/
timezone: Europe/Madrid

# --- Plugins ---------------------------------------------------------------
plugins:
  - jekyll-feed
  - jekyll-gist
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-redirect-from
  - jemoji

whitelist:
  - jekyll-feed
  - jekyll-gist
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-redirect-from
  - jemoji

# --- Archives --------------------------------------------------------------
category_archive:
  type: liquid
  path: /categories/
tag_archive:
  type: liquid
  path: /tags/

# --- HTML compression ------------------------------------------------------
compress_html:
  clippings: all
  ignore:
    envs: development
